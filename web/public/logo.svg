<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161f" />
      <stop offset="100%" stop-color="#09090c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Minimal Dark Squircle Base -->
  <rect x="3" y="3" width="58" height="58" rx="18" fill="url(#bgGrad)" stroke="#262636" stroke-width="1.5" />

  <!-- Outer Neon Orbital Arc -->
  <circle cx="32" cy="32" r="16" stroke="url(#purpleGlow)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="75 25" filter="url(#glow)" />

  <!-- Inner Glowing Core -->
  <circle cx="32" cy="32" r="6.5" fill="url(#purpleGlow)" />

  <!-- Top-Right Satellite Dot -->
  <circle cx="44" cy="20" r="2.5" fill="#e9d5ff" />
</svg>
