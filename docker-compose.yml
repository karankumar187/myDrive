services:
  mongodb:
    image: mongo:7.0
    container_name: drive_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: drive_admin
      MONGO_INITDB_ROOT_PASSWORD: drive_password
      MONGO_INITDB_DATABASE: unified_drive
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: drive_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
